name: C++ Build with Meson on Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build:
    runs-on: windows-latest  # This ensures the build runs on a Windows environment

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Meson and Ninja
      run: |
        choco install meson ninja

    - name: Configure Meson (Build Setup)
      run: |
        meson setup emulator --buildtype=release

    - name: Build with Meson
      run: |
        meson compile -C emulator

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: emulator/
