name: Windows Build

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type (debug/release)'
        required: true
        default: 'release'
        type: choice
        options:
        - debug
        - release
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Meson and Ninja
      run: |
        python -m pip install --upgrade pip
        pip install meson ninja

    - name: Configure build
      working-directory: ./emulator
      run: |
        meson setup emulator `
          --backend vs2022 `
          --buildtype ${{ github.event.inputs.build-type }}
      
    - name: Compile
      working-directory: ./emulator
      run: |
        meson compile -C emulator

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-emulator-${{ github.event.inputs.build-type }}
        path: ./emulator/builddir/emulator.exe
