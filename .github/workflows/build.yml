name: C++ Build with Meson on Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build:
    runs-on: windows-latest  # This ensures the build runs on a Windows environment

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'  # Install the latest version of Python

    - name: Install Meson and Ninja using pip
      run: |
        python -m pip install --upgrade pip  # Ensure pip is up-to-date
        pip install meson ninja  # Install Meson and Ninja via pip

    - name: Verify Meson installation
      run: |
        meson --version  # Verify that Meson is installed

    - name: Configure Meson (Build Setup)
      run: |
        meson setup builddir --buildtype=release

    - name: Build with Meson
      run: |
        meson compile -C builddir

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: builddir/
